name: Автопостинг у Threads

on:
  schedule:
    - cron: "5 7,8,9,10 * * *"
    - cron: "5 17,18,19,20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Опублікувати пост прямо зараз (тест)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Публікація
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python autopost.py

      - name: Зберегти, що вже використано
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Оновлено state.json" && git push)
